name: fundenflo

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fundenflo
      POSTGRES_PASSWORD: fundenflo
      POSTGRES_DB: fundenflo
    ports:
      - "${FF_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundenflo -d fundenflo"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${FF_VALKEY_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--loose", "--skipApiVersionCheck"]
    ports:
      - "${FF_AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "${FF_SMTP_PORT:-1025}:1025"
      - "${FF_MAILPIT_UI_PORT:-8025}:8025"

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "${FF_CLAMAV_PORT:-3310}:3310"

volumes:
  postgres-data:
  valkey-data:
  azurite-data:
