name: fundenflo

x-app: &app
  env_file: ../.env
  restart: unless-stopped
  init: true
  depends_on:
    valkey:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "${FF_CLAMAV_PORT:-3310}:3310"

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${FF_VALKEY_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: ["prod"]
    <<: *app
    build:
      context: ../web-frontend
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: fundenflo-web:latest
    ports: ["127.0.0.1:6001:3100"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    depends_on: []

  api:
    profiles: ["prod"]
    <<: *app
    build:
      context: .
      target: runtime
    image: fundenflo-api:latest
    command: ["node", "dist/main.js"]
    ports: ["127.0.0.1:6000:3000"]
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s

  worker:
    profiles: ["prod"]
    <<: *app
    image: fundenflo-api:latest
    command: ["node", "dist/worker.js"]
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1g

  tools:
    profiles: ["tools"]
    build:
      context: .
      target: builder
    image: fundenflo-tools:latest
    env_file: ../.env
    working_dir: /app

volumes:
  valkey-data:
